import aQute.bnd.gradle.Export

plugins {
  id "org.sonarqube" version "6.3.1.5724"
  id 'jacoco'
  id 'java'
  id 'org.geckoprojects.bnd.update'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
  // Only for the SBOM exporter, which has no release yet (see sbomExporter below).
  maven {
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
    mavenContent {
      snapshotsOnly()
      includeGroup 'org.geckoprojects.bnd'
    }
  }
}

// SBOM of the resolved application: `./gradlew sbom` writes a CycloneDX SBOM per bndrun to
// <project>/generated/sbom/ (options in the bndrun's -sbom instruction). The exporter is a bnd
// plugin (org.gecko.bnd.sbom); Gradle fetches it into cnf/cache/sbom-exporter/, and only then
// do the bndruns include it (cnf/sbom/plugin.bnd). The ordinary build never loads it.
configurations {
  sbomExporter {
    canBeConsumed = false
    transitive = false
  }
}
dependencies {
  // TODO switch to the first release once org.gecko.bnd.sbom is on Maven Central
  sbomExporter 'org.geckoprojects.bnd:org.gecko.bnd.sbom:0.1.0-SNAPSHOT'
}
def sbomExporter = tasks.register('sbomExporter', Sync) {
  description = 'Fetches the SBOM exporter into cnf/cache/sbom-exporter/, where the bndruns pick it up.'
  from configurations.sbomExporter
  into 'cnf/cache/sbom-exporter'
  rename { 'org.gecko.bnd.sbom.jar' }
}

def sbomBndruns = [
  // the change stream reference example (stream runtime, JPA persistence, OGC API Features, STA)
  'org.eclipse.fennec.stream.example.pool': 'pool.bndrun'
]
// Register only for the projects that are part of this build.
def sbomTasks = sbomBndruns.findResults { projectName, bndrunName ->
  def p = findProject(":${projectName}")
  p?.tasks?.register('sbom', Export) {
    description = "Writes the SBOM of ${bndrunName} (CycloneDX) to generated/sbom/."
    group = 'export'
    dependsOn sbomExporter
    bndrun = p.file(bndrunName)
    exporter = 'bnd.sbom'
    destinationDirectory = p.layout.projectDirectory.dir('generated/sbom')
    // The inputs Gradle sees are the bndrun file only, not its -include chain nor the
    // repository contents behind it, so an up-to-date check would hand out a stale SBOM.
    outputs.upToDateWhen { false }
  }
}
tasks.register('sbom') {
  description = 'Writes the SBOMs of the emf.streaming runtimes (see sbomBndruns).'
  group = 'export'
  dependsOn sbomTasks
}

// bnd update (org.gecko.bnd.update): reports only, nothing is changed.
//   ./gradlew bndUpdates                    newer versions in the .mvn indexes, within the policy
//   ./gradlew bndVulnerabilities -PbndUpdateTrivy=<trivy.json> -PbndUpdateSbom=<sbom.cdx.json>
//                                           for each library of the Trivy report of that SBOM:
//                                           the smallest fixing version within the policy
// Reports in build/bnd-update/. The policy is micro updates unless -PbndUpdateScope says
// otherwise. Findings never fail the build here; the gate is the Trivy step in sbom.yml.
bndUpdate {
  scope = providers.gradleProperty('bndUpdateScope').orElse('micro')
  format = providers.gradleProperty('bndUpdateFormat').orElse('markdown')
  failOnFindings = false
  if (providers.gradleProperty('bndUpdateTrivy').isPresent()) {
    trivyReport = file(providers.gradleProperty('bndUpdateTrivy').get())
  }
  if (providers.gradleProperty('bndUpdateSbom').isPresent()) {
    sbom = file(providers.gradleProperty('bndUpdateSbom').get())
  }
}

subprojects {

    //  Apply plugin: 'jacoco' to all submodules JUnit tests are generated as generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }
    // Allow gradle to enable JUnit support in submodules
    // Exclude @Tag("perf") (slow) and @Tag("remote") (needs internet) tests from normal
    // builds — run via the perfTest / remoteTest tasks. Tests against a PostgreSQL
    // container are not tagged: they skip themselves (JUnit assumption) unless the
    // container flavor is requested, see the tests.postgres project.
    test {
        useJUnitPlatform {
            excludeTags 'perf', 'remote'
        }
    }

    // Dedicated task for the slow scaling tests (@Tag("perf"), kept out of the fast build).
    tasks.register('perfTest', Test) {
        useJUnitPlatform {
            includeTags 'perf'
        }
    }

    // Dedicated task for tests against PUBLIC endpoints (@Tag("remote")): they validate the
    // service-client design against real services but depend on internet + third-party uptime,
    // so they never gate the normal build. Run explicitly: ./gradlew remoteTest
    tasks.register('remoteTest', Test) {
        useJUnitPlatform {
            includeTags 'remote'
        }
    }

    // Add JUnit dependencies for modules that have Gradle tests
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.4'
        testImplementation 'org.mockito:mockito-core:5.24.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }

    // Coverage floor: a catastrophic-regression tripwire (e.g. a bundle's tests deleted) wired
    // into `check`. Conservative baseline of 30% instructions on the hand-written code of the
    // library bundles that carry plain-JUnit tests — generated code and test-only/OSGi-covered
    // bundles are out of scope. Ratchet upward as coverage is deliberately raised.
    // Add each core bundle here as it gains plain-JUnit tests.
    def coverageFloorBundles = [
    ]
    afterEvaluate {
        if (project.name in coverageFloorBundles) {
            tasks.named('jacocoTestCoverageVerification') {
                // exclude generated code (ANTLR parser, EMF src-gen models)
                def generated = ['**/antlr/**']
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: generated)
                }))
                violationRules {
                    rule {
                        limit {
                            counter = 'INSTRUCTION'
                            value = 'COVEREDRATIO'
                            minimum = 0.30
                        }
                    }
                }
            }
            tasks.named('check').configure { dependsOn 'jacocoTestCoverageVerification' }
        }
    }

}

// Sonar setup — values come from gradle.properties (github_org, github_repository)
sonarqube {
  properties {
    property "sonar.projectName", github_repository
    property "sonar.projectKey", github_org + "-" + github_repository
    property "sonar.organization", github_org
    property "sonar.host.url", "https://sonarcloud.io"
    property "sonar.coverage.jacoco.xmlReportPaths", rootDir.toString() + "/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
  }
}

tasks.register('codeCoverageReport', JacocoReport) {
    dependsOn(test)
    // Gather execution data from all subprojects for JUnit generated/jacoco/test.exec for OSGi Tests generated/tmp/testOSGi/generated/jacoco.exec
    // Latter are generated via agent in the test.bndrun
    executionData fileTree(project.rootDir.absolutePath).include("**/**/*.exec")

    // Add all relevant sourcesets from the subprojects
    subprojects.each {
        sourceSets it.sourceSets.main
    }

    // Generate xml reports for tools like sonar and html for humans
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named("sonar") {
    dependsOn(codeCoverageReport)
}
